<body id="top">
  <header class="site-header">
    <div class="container nav">
      <a class="brand brand--logo" href="index.html" aria-label="Slayin With Amy">
        <img src="assets/images/logo.png" alt="Slayin With Amy">
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a class="active" href="gallery.html">Gallery</a>

      <div class="nav-social">

  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox__backdrop" data-close></div>

    <div class="lightbox__panel" role="dialog" aria-modal="true" aria-label="Brand carousel">
      <button class="lightbox__close" type="button" data-close aria-label="Close">✕</button>

      <div class="lightbox__header">
        <img id="lbLogo" alt="Brand logo">
      </div>

      <div class="swiper" id="brandSwiper">
        <div class="swiper-wrapper" id="swiperWrapper"></div>

        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
  </div>

  <section class="brand-strip" aria-label="Brand logos">
    <div class="brand-strip__inner" data-marquee>
      <img src="assets/images/edhardy.png" alt="Ed Hardy" loading="lazy" />
      <img src="assets/images/fubu.png" alt="FUBU" loading="lazy" />
      <img src="assets/images/madrag.png" alt="Madrag Stores" loading="lazy" />
      <img src="assets/images/cape robbin.png" alt="Ceperobbin" loading="lazy" />

      <img src="assets/images/harbor-house.png" alt="Harbor House Living" loading="lazy" />
      <img src="assets/images/carrera_eyewear.png" alt="Carrera Eyewear" loading="lazy" />
      <img src="assets/images/limited-too.png" alt="Limited Too" loading="lazy" />
      <img src="assets/images/baleaf.png" alt="Baleaf Sport" loading="lazy" />
      <img src="assets/images/Raeli brand.jpg" alt="Raeli Brand" loading="lazy" />

  <footer class="connect-footer connect-footer--mini">

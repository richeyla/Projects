  <!-- ============ CONTACT PAGE ============ -->
  <main class="contact-main">
    <!-- Hero -->
    <section class="contact-hero">
      <h1 class="contact-title" data-i18n="contact.title">
        Let’s Create Something Beautiful Together
      </h1>
      <p class="contact-subtitle" data-i18n="contact.subtitle">
        Fill out the form below and we’ll get back to you with availability,
        details and next steps.
      </p>
    </section>

    <!-- Contact Form (card) -->
    <section class="contact-section">
      <form class="contact-form" action="send-contact.php" method="POST">
        <div class="form-group">
          <label for="name" data-i18n="contact.name.label">Full Name</label>
          <input type="text" id="name" placeholder="Your name" required />
        </div>

        <div class="form-group">
          <label for="email" data-i18n="contact.email.label">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone" data-i18n="contact.phone.label">Phone Number</label>
          <input type="text" id="phone" placeholder="(000)-000-0000" />
        </div>

        <div class="form-group">
          <label for="date" data-i18n="contact.date.label">Wedding Date</label>
          <input type="date" id="date" />
        </div>

        <div class="form-group">
          <label for="location" data-i18n="contact.location.label">Wedding Location</label>
          <input type="text" id="location" placeholder="Venue / City" />
        </div>

        <!-- Estimated budget -->
        <div class="form-group">
          <label for="budget" data-i18n="contact.budget.label">Estimated Budget</label>
          <input
            type="text"
            id="budget"
            placeholder="e.g. $1,500 – $2,000"
          />
        </div>

        <!-- Servicios / Paquetes -->
        <div class="form-group full">
          <label data-i18n="contact.services.label">What services are you interested in?</label>

          <div class="services-options">
            <label>
              <input
                type="checkbox"
                name="services[]"
                value="genacy-essential"
              />
              The Genacy Essential ($800)
            </label>

            <label>
              <input
                type="checkbox"
                name="services[]"
                value="genacy-signature"
              />
              The Genacy Signature ($1,500)
            </label>

            <label>
              <input
                type="checkbox"
                name="services[]"
                value="genacy-cinematic"
              />
              The Genacy Cinematic ($2,000)
            </label>

            <label>
              <input
                type="checkbox"
                name="services[]"
                value="genacy-luxe"
              />
              The Genacy Luxe Experience ($4,000)
            </label>
          </div>
        </div>

        <div class="form-group full">
          <label for="message" data-i18n="contact.message.label">Tell us about your wedding</label>
          <textarea
            id="message"
            rows="5"
            placeholder="Share your vision, style and any details..."
          ></textarea>
        </div>
                  <!-- NUEVO: Express delivery -->
          <div class="form-group full">
            <label class="inline-label">
              <input
                type="checkbox"
                id="express_delivery"
                name="express_delivery"
                value="yes"
              />
              <span data-i18n="contact.express">
                Express delivery (optional, additional fee)
              </span>
            </label>
          </div>

        <button type="submit" class="primary-button contact-btn" data-i18n="contact.button">
          Send Message
        </button>
      </form>
    </section>
  </main>
